<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sprite-Studio — edición de sprites, cuadro a cuadro</title>
  <desc id="desc">Portada de Sprite-Studio con la interfaz del editor, la línea de tiempo de animación y el personaje Palomin.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171a18"/><stop offset="1" stop-color="#252b26"/></linearGradient>
    <linearGradient id="clay" x2="1" y2="1"><stop stop-color="#f1a17b"/><stop offset="1" stop-color="#d67555"/></linearGradient>
    <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#202521"/><stop offset="1" stop-color="#191d1a"/></linearGradient>
    <pattern id="checker" width="24" height="24" patternUnits="userSpaceOnUse"><path fill="#d6d8d2" d="M0 0h12v12H0zM12 12h12v12H12z"/><path fill="#f0f0eb" d="M12 0h12v12H12zM0 12h12v12H0z"/></pattern>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#bac2b6" opacity=".15"/></pattern>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#070908" flood-opacity=".48"/></filter>
    <clipPath id="sprite"><rect x="765" y="202" width="310" height="370" rx="14"/></clipPath>
  </defs>
